
services:
  agriculture-rag:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: agriculture-rag:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  agriculture-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: agriculture-frontend:latest
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://agriculture-rag:8000
    depends_on:
      - agriculture-rag
    restart: unless-stopped

name: Build and Push to ECR

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: agriculture-rag-assistant

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::097083928031:role/GitHubActions-AgricultureRAG
          aws-region: ap-south-1

      - name: Download knowledge files
        run: |
          mkdir -p knowledge
          aws s3 cp s3://myfirstragchatbot-097083928031-ap-south-1-an/knowledge/ ./knowledge/ --recursive

      - name: Create .env
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate vectorstore
        run: python ingest.py

      - name: Move vectorstore
        run: |
          mkdir -p backend/vectorstore
          cp -r vectorstore/* backend/vectorstore/

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t agriculture-rag-assistant .

      - name: Tag Docker Image
        run: |
          docker tag agriculture-rag-assistant:latest \
          097083928031.dkr.ecr.ap-south-1.amazonaws.com/agriculture-rag-assistant:latest

      - name: Push Docker Image
        run: |
          docker push \
          097083928031.dkr.ecr.ap-south-1.amazonaws.com/agriculture-rag-assistant:latest
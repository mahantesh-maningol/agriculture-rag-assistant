name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::097083928031:role/GitHubActions-AgricultureRAG
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Download knowledge files from S3
        run: |
          mkdir -p knowledge
          aws s3 cp s3://myfirstragchatbot-097083928031-ap-south-1-an/knowledge/ ./knowledge/ --recursive

      - name: List downloaded files
        run: ls -lh knowledge/